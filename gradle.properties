org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# The Kotlin compile daemon is a separate JVM and inherits the Windows ANSI
# codepage without this. Sources carry ·, ≈, ½, ‰ and the localized resources are
# UTF-8 throughout, so a mis-decoded source is silent mojibake at best and a
# "too many characters in a character literal" build failure at worst.
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
